name: Portal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: portal_ci
          POSTGRES_USER: portal_ci
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal_ci -d portal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_ENGINE: ${{ matrix.database }}
      POSTGRES_DB: portal_ci
      POSTGRES_USER: portal_ci
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test main schedule materials --noinput
      - run: docker build -t portal-ci .
