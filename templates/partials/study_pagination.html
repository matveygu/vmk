{% if page_obj.has_other_pages %}<nav class="ds-actions" aria-label="Страницы">{% if page_obj.has_previous %}<a class="ds-btn ds-btn-secondary" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="ds-btn ds-btn-secondary" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее</a>{% endif %}</nav>{% endif %}
