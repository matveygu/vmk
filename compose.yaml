name: msu-portal

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Create .env.docker first}
      POSTGRES_USER: ${POSTGRES_USER:?Create .env.docker first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env.docker first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  web:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_ENGINE: postgresql
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PORTAL_DATA_DIR: /app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

volumes:
  postgres_data:
