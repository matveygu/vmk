<form method="post" action="{% url 'material_favorite' material.pk %}" class="study-inline-form">{% csrf_token %}
  <input type="hidden" name="favorite" value="{% if material.is_favorite %}0{% else %}1{% endif %}">
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="ds-icon-btn material-favorite{% if material.is_favorite %} is-active{% endif %}" aria-pressed="{{ material.is_favorite|yesno:'true,false' }}" title="{% if material.is_favorite %}Убрать из избранного{% else %}В избранное{% endif %}" aria-label="{% if material.is_favorite %}Убрать из избранного{% else %}В избранное{% endif %}: {{ material.name }}"><i class="{% if material.is_favorite %}fas{% else %}far{% endif %} fa-star" aria-hidden="true"></i></button>
</form>
