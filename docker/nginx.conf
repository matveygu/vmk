# Install on the VM as /etc/nginx/sites-available/msu-portal.
# Replace portal.example.ru and /srv/msu/portal if your domain/path differ.
# Certbot adds the HTTPS server and certificates to this configuration.
server {
    listen 80;
    server_name portal.example.ru;
    client_max_body_size 50m;
    access_log off; # Password-reset tokens must not be written to URL logs.

    # Docker probes Gunicorn directly on loopback; no public DB readiness endpoint.
    location = /_health/ {
        return 404;
    }

    location /static/ {
        alias /srv/msu/portal/staticfiles/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /_media_auth/ {
        internal;
        proxy_pass http://127.0.0.1:8000/_media_auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /media/ {
        auth_request /_media_auth/;
        alias /srv/msu/portal/data/media/;
        autoindex off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        # Untrusted HTML/SVG are downloads, not executable same-origin pages.
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/pdf pdf;
            audio/mpeg mp3;
            video/mp4 mp4;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
